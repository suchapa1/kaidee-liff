<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ยืนยันตัวตน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{ --cream:#f5f0e6; --green:#5c6b4f; --green-dark:#3c4a35; --danger:#b0453f; }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family:'Sarabun','Segoe UI',Tahoma,sans-serif; color:#33362e;
      background:var(--cream); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .card{ background:#fff; border-radius:18px; padding:28px 24px; width:100%; max-width:360px; box-shadow:0 8px 24px rgba(60,74,53,0.10); text-align:center; }
    h1{ font-size:18px; color:var(--green-dark); margin:0 0 4px; }
    p.sub{ font-size:13px; color:#8b8878; margin:0 0 22px; }
    label{ display:block; text-align:left; font-size:13px; font-weight:600; color:#5a5748; margin-bottom:6px; }
    input{ width:100%; padding:12px 14px; border:1.5px solid #e6e0d1; border-radius:10px; font-size:16px; margin-bottom:16px; font-family:inherit; }
    input:focus{ outline:none; border-color:var(--green); }
    button{ width:100%; padding:13px; border:none; border-radius:10px; background:var(--green); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
    button:disabled{ opacity:.6; }
    .msg{ font-size:13px; margin-top:14px; min-height:16px; }
    .msg.err{ color:var(--danger); }
    .msg.ok{ color:#2e6b3e; }
    .successBox{ display:none; }
    .checkmark{ font-size:40px; color:#2e6b3e; margin-bottom:6px; }
    .formBox{ display:block; }
  </style>
</head>
<body>
  <div class="card">
    <div id="formBox" class="formBox">
      <h1>ระบบยืนยันตัวตน</h1>
      <p class="sub" id="accountLabel">-</p>
      <label for="phoneInput">เบอร์โทรศัพท์ที่ลงทะเบียนไว้กับคลินิก</label>
      <input id="phoneInput" type="tel" inputmode="numeric" placeholder="เช่น 0812345678" maxlength="15">
      <button id="submitBtn" onclick="submitVerify()" disabled>กำลังเตรียมระบบ...</button>
      <div id="msgBox" class="msg"></div>
      <div id="debugBox" style="font-size:10px;color:#c4c0b0;margin-top:10px;text-align:left;word-break:break-all;"></div>
    </div>
    <div id="successBox" class="successBox">
      <div class="checkmark">✓</div>
      <h1>การยืนยันตัวตนเสร็จสมบูรณ์</h1>
      <p class="sub" id="successName">-</p>
      <div style="font-size:12px;color:#a19d8a;">ท่านสามารถปิดหน้านี้ได้เลยค่ะ</div>
    </div>
  </div>

<script>
  // ============================================================
  //  ตั้งค่า 2 จุดนี้ครั้งเดียวตอนติดตั้ง (แก้ตรงนี้ที่เดียว ใช้ได้ทุกสาขา):
  // ============================================================

  // ============================================================
  //  URL เว็บแอป Apps Script — แก้ตรงนี้เองได้เลยเวลา URL เปลี่ยน (ไม่ต้องขอให้ช่วย encode อีกแล้ว)
  //  วิธีดู URL ล่าสุด: Apps Script > Deploy > Manage deployments > คัดลอก URL ที่ลงท้ายด้วย /exec มาวางแทนบรรทัดล่างนี้เลย
  //  (ปกติ URL ไม่ควรเปลี่ยนถ้ากด Deploy แบบ "New version" ทุกครั้ง ไม่ใช่ "New deployment")
  // ============================================================
  const API_URL_FALLBACK = 'https://script.google.com/macros/s/AKfycbwWc2MbLODWU0jtyE_LNA9tqkdbxebqXWCu3szWktakyxgo0e1RzrAvCtSKU5PP0zA8Ww/exec';

  // LIFF ID ของแต่ละสาขา (คัดลอกจากหน้า LINE Developers Console > LIFF ของ channel นั้นๆ) — แก้ตรงนี้เองได้เลยเช่นกัน
  const LIFF_ID_MAP = {
    'NPT': '2011142627-EkHcD8Ut',
    'BKK-TWN': '2011198160-Lwjxa1Ci',
    'BKK-Bangna': ''
  };
  const ACCOUNT_NAME_MAP = {
    'NPT': 'KAI DEE CLINIC สาขานครปฐม',
    'BKK-TWN': 'KAI DEE CLINIC สาขาธนบุรี',
    'BKK-Bangna': 'KAI DEE CLINIC สาขาบางนา'
  };
  // ============================================================

  const params = new URLSearchParams(location.search);
  const BRANCH = params.get('branch') || '';
  // ถ้า Endpoint URL มี &apiUrl=/&liffId= ใส่ไว้อยู่แล้ว (จากที่เคยตั้งไว้ก่อนหน้านี้) ระบบจะยังใช้ค่านั้นก่อนเป็นอันดับแรก
  // แต่ถ้าไม่มี ก็จะใช้ค่าคงที่ด้านบนแทน — แก้ที่เดียวตรงนี้ก็พอ ไม่ต้องไปแก้ Endpoint URL ใน LINE Console อีก
  const API_URL = params.get('apiUrl') ? decodeURIComponent(params.get('apiUrl')) : API_URL_FALLBACK;
  const LIFF_ID = params.get('liffId') || LIFF_ID_MAP[BRANCH] || '';
  let lineUserId = '';

  const ACCOUNT_NAME_FROM_URL = params.get('accountName') ? decodeURIComponent(params.get('accountName')) : '';
  document.getElementById('accountLabel').innerText = ACCOUNT_NAME_FROM_URL || ACCOUNT_NAME_MAP[BRANCH] || ('สาขา ' + BRANCH);
  document.getElementById('debugBox').innerText = 'debug: branch=' + (BRANCH || '(ว่าง)') + ' | liffId=' + (LIFF_ID || '(ว่าง)');

  window.addEventListener('DOMContentLoaded', async function(){
    const btn = document.getElementById('submitBtn');
    const dbg = document.getElementById('debugBox');
    if (!BRANCH || !LIFF_ID) {
      setMsg('ลิงก์นี้ไม่ถูกต้องหรือยังไม่ได้ตั้งค่า LIFF ID ของสาขานี้ กรุณาติดต่อผู้ดูแลระบบคลินิก', true);
      return;
    }
    const withTimeout_ = (promise, ms, label) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('หมดเวลารอ (' + label + ')')), ms))
    ]);
    try {
      await withTimeout_(liff.init({ liffId: LIFF_ID }), 12000, 'liff.init');
      dbg.innerText += ' | isInClient=' + liff.isInClient() + ' | isLoggedIn=' + liff.isLoggedIn();
      if (!liff.isLoggedIn()) {
        btn.innerText = 'กำลังนำท่านเข้าสู่ระบบ LINE...';
        liff.login();
        return;
      }
      const profile = await withTimeout_(liff.getProfile(), 12000, 'liff.getProfile');
      lineUserId = profile.userId;
      dbg.innerText += ' | userId=' + (lineUserId ? (lineUserId.slice(0,6) + '...' + lineUserId.slice(-4)) : '(ว่าง)');
      btn.innerText = 'ยืนยันตัวตน';
      btn.disabled = false;
    } catch (e) {
      dbg.innerText += ' | ERROR: ' + e.message;
      setMsg('เปิดระบบยืนยันตัวตนไม่สำเร็จ: ' + e.message, true);
      btn.innerText = 'ลองใหม่อีกครั้ง';
      btn.disabled = false;
      btn.onclick = function(){ window.location.reload(); };
    }
  });

  function setMsg(text, isErr){
    const el = document.getElementById('msgBox');
    el.innerText = text;
    el.className = 'msg ' + (isErr ? 'err' : 'ok');
  }

  function submitVerify(){
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone) { setMsg('กรุณากรอกเบอร์โทรศัพท์', true); return; }
    if (!lineUserId) { setMsg('ไม่พบข้อมูลบัญชี LINE กรุณาลองเปิดหน้านี้ใหม่อีกครั้ง', true); return; }
    setMsg('กำลังนำท่านไปหน้ายืนยันตัวตน...', false);

    // พาไปหน้าผลลัพธ์ตรงๆ (เหมือนกดลิงก์ธรรมดาทั่วไป) แทนการเรียกข้ามหน้าด้วย fetch/script-tag/iframe ที่เจอปัญหาถูกบล็อกมาก่อนหน้านี้
    // วิธีนี้เป็นการเปลี่ยนหน้าเว็บปกติ (ไม่ใช่ CORS request) จึงไม่ติดข้อจำกัดด้านความปลอดภัยของเบราว์เซอร์เลย รับประกันว่าใช้ได้แน่นอน
    const url = API_URL + '?action=lookupPhone'
      + '&phone=' + encodeURIComponent(phone)
      + '&branch=' + encodeURIComponent(BRANCH)
      + '&lineUserId=' + encodeURIComponent(lineUserId)
      + '&selfUrl=' + encodeURIComponent(API_URL)
      + '&_t=' + Date.now(); // กันแคช — ทดสอบด้วยเบอร์เดิมซ้ำๆ URL จะเหมือนเดิมทุกครั้ง เสี่ยงโดนแอป LINE แคชหน้าเก่าไว้แสดงแทนของใหม่
    document.getElementById('debugBox').innerText += ' | กำลังเปิด: ' + url;
    window.location.href = url;
  }
</script>
</body>
</html>
